[package]
name = "lumen-app"
description = "Lumen — find any file on your Mac, instantly"
version = "0.7.0"
edition = "2021"
license = "MIT"

# Standalone workspace: links macOS frameworks, built with `cargo tauri build`.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumen-core = { path = "../../crates/lumen-core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
trash = "5"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
