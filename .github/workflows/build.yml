name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  macos:
    needs: engine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build the OCR helper (Apple Vision)
        run: |
          mkdir -p app/src-tauri/binaries
          for arch in arm64 x86_64; do
            swiftc -O -target $arch-apple-macos11 app/ocr/main.swift -o /tmp/lumen-ocr-$arch
          done
          lipo -create /tmp/lumen-ocr-arm64 /tmp/lumen-ocr-x86_64 -output /tmp/lumen-ocr
          for t in universal-apple-darwin aarch64-apple-darwin x86_64-apple-darwin; do
            cp /tmp/lumen-ocr app/src-tauri/binaries/lumen-ocr-$t
          done
          # Smoke test on a screenshot of Lumen itself: it shows the word 合同.
          /tmp/lumen-ocr docs/screenshots/quick.jpg | tee /tmp/ocr.txt | head -20
          grep -q "合同" /tmp/ocr.txt
          /tmp/lumen-ocr embed-info
          # Sentence embeddings (semantic search): related sentences must sit
          # closer than unrelated ones, in both Apple models.
          printf 'zh\t北海道的雪景视频\nzh\t札幌冬天下雪拍的录像\nzh\t公司第三季度财务报表\nen\tsnow videos from hokkaido\nen\twinter footage in sapporo snow\nen\tquarterly finance spreadsheet\n' \
            | /tmp/lumen-ocr embed > /tmp/emb.txt
          python3 - <<'PY2'
          import math
          v = [[float(x) for x in l.split(",")] if l.strip() else None for l in open("/tmp/emb.txt").read().split("\n")[:6]]
          def cos(a, b): return sum(x * y for x, y in zip(a, b)) / math.sqrt(sum(x * x for x in a) * sum(y * y for y in b))
          for name, (q, near, far) in {"zh": (0, 1, 2), "en": (3, 4, 5)}.items():
              if not v[q]: print(f"{name}: model unavailable on this runner"); continue
              print(f"{name}: dims={len(v[q])} near={cos(v[q], v[near]):.3f} far={cos(v[q], v[far]):.3f}")
              assert cos(v[q], v[near]) > cos(v[q], v[far]), name
          assert v[3], "English sentence model missing"
          PY2
      - name: Build the lumen CLI (bundled in Lumen.app)
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p lumen-cli --target $t
          done
          lipo -create target/aarch64-apple-darwin/release/lumen target/x86_64-apple-darwin/release/lumen -output /tmp/lumen
          for t in universal-apple-darwin aarch64-apple-darwin x86_64-apple-darwin; do
            cp /tmp/lumen app/src-tauri/binaries/lumen-$t
          done
          /tmp/lumen --alfred search lumen | python3 -c "import json,sys; json.load(sys.stdin)['items']"
      - name: Package the Alfred workflow
        run: cd integrations/alfred && zip -r "$GITHUB_WORKSPACE/Lumen.alfredworkflow" info.plist
      - name: Build universal app
        working-directory: app/src-tauri
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the in-app update (independent of Apple's Developer ID).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Without a Developer ID certificate in the repo secrets, the app is
        # ad-hoc signed (runs after right-click → Open). An empty
        # APPLE_CERTIFICATE makes Tauri fail, so pass it only when it is set.
        run: |
          if [ -n "$CERT" ]; then
            export APPLE_CERTIFICATE="$CERT" APPLE_CERTIFICATE_PASSWORD="$CERT_PASSWORD" \
                   APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY" APPLE_ID="$NOTARY_ID" \
                   APPLE_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$TEAM_ID"
          else
            export APPLE_SIGNING_IDENTITY="-"
          fi
          extra=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          cargo tauri build --target universal-apple-darwin "${extra[@]}"
          # The bundled CLI and the lumen:// scheme made it into the app.
          A=target/universal-apple-darwin/release/bundle/macos/Lumen.app
          test -x "$A/Contents/MacOS/lumen"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$A/Contents/Info.plist" | grep -qx lumen
          # The signature covers everything in the bundle (a broken one gets the
          # app killed at launch on Apple silicon).
          codesign --verify --deep --strict --verbose=2 "$A"
      - name: Launch smoke test (first launch, relaunch on the existing index, second instance)
        working-directory: app/src-tauri
        run: |
          A=target/universal-apple-darwin/release/bundle/macos/Lumen.app
          EXE="$A/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$A/Contents/Info.plist")"
          LOG="$HOME/Library/Logs/app.lumen.desktop/Lumen.log"
          alive() { sleep "$2"; kill -0 "$1" 2>/dev/null || { echo "::error::Lumen exited ($3)"; cat "$LOG" 2>/dev/null; exit 1; }; }
          "$EXE" & P=$!; alive $P 15 "first launch"
          kill $P; wait $P 2>/dev/null || true; sleep 2
          "$EXE" & P=$!; alive $P 15 "second launch, existing index"
          # A second copy hands over to the running one and exits.
          "$EXE" & Q=$!; sleep 8
          if kill -0 $Q 2>/dev/null; then echo "::error::two Lumen processes running"; exit 1; fi
          alive $P 1 "after a second instance"
          kill $P; wait $P 2>/dev/null || true
          grep -q "index open" "$LOG" || { echo "::error::no launch log"; cat "$LOG"; exit 1; }
          cat "$LOG"
      - name: Update manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          B=app/src-tauri/target/universal-apple-darwin/release/bundle/macos
          [ -f "$B/Lumen.app.tar.gz.sig" ] || { echo "no updater signature, skipping"; exit 0; }
          VER=${GITHUB_REF_NAME#v}
          mv "$B/Lumen.app.tar.gz" "$B/Lumen_universal.app.tar.gz"
          mv "$B/Lumen.app.tar.gz.sig" "$B/Lumen_universal.app.tar.gz.sig"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Lumen_universal.app.tar.gz"
          python3 - "$VER" "$URL" "$B/Lumen_universal.app.tar.gz.sig" > "$B/latest.json" <<'PY'
          import json, sys, datetime
          ver, url, sig = sys.argv[1], sys.argv[2], open(sys.argv[3]).read().strip()
          p = {"signature": sig, "url": url}
          print(json.dumps({"version": ver, "notes": f"Lumen {ver}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"darwin-aarch64": p, "darwin-x86_64": p, "darwin-universal": p}}, indent=2))
          PY
          cat "$B/latest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-macos-universal
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      # Tag a version (git tag v0.2.0 && git push --tags) to publish the DMG.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/Lumen_universal.app.tar.gz
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/Lumen_universal.app.tar.gz.sig
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/latest.json
            Lumen.alfredworkflow
          fail_on_unmatched_files: false
          generate_release_notes: true
      # Point the Homebrew cask (Casks/lumen-finder.rb, this repo is the tap)
      # at the new DMG.
      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=${GITHUB_REF_NAME#v}
          DMG=$(ls app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          SHA=$(shasum -a 256 "$DMG" | cut -d' ' -f1)
          git fetch origin main && git checkout -B main origin/main
          sed -i '' -E "s/^  version \".*\"/  version \"$VER\"/; s/^  sha256 .*/  sha256 \"$SHA\"/" Casks/lumen-finder.rb
          git diff --stat
          git -c user.name=lumen-ci -c user.email=ci@users.noreply.github.com commit -am "cask: lumen-finder $VER [skip ci]" || exit 0
          git push origin main
