name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  macos:
    needs: engine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build the OCR helper (Apple Vision)
        run: |
          mkdir -p app/src-tauri/binaries
          for arch in arm64 x86_64; do
            swiftc -O -target $arch-apple-macos11 app/ocr/main.swift -o /tmp/lumen-ocr-$arch
          done
          lipo -create /tmp/lumen-ocr-arm64 /tmp/lumen-ocr-x86_64 -output /tmp/lumen-ocr
          for t in universal-apple-darwin aarch64-apple-darwin x86_64-apple-darwin; do
            cp /tmp/lumen-ocr app/src-tauri/binaries/lumen-ocr-$t
          done
          # Smoke test on a screenshot of Lumen itself: it shows the word 合同.
          /tmp/lumen-ocr docs/screenshots/quick.jpg | tee /tmp/ocr.txt | head -20
          grep -q "合同" /tmp/ocr.txt
      - name: Build universal app
        working-directory: app/src-tauri
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the in-app update (independent of Apple's Developer ID).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Without a Developer ID certificate in the repo secrets, the app is
        # ad-hoc signed (runs after right-click → Open). An empty
        # APPLE_CERTIFICATE makes Tauri fail, so pass it only when it is set.
        run: |
          if [ -n "$CERT" ]; then
            export APPLE_CERTIFICATE="$CERT" APPLE_CERTIFICATE_PASSWORD="$CERT_PASSWORD" \
                   APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY" APPLE_ID="$NOTARY_ID" \
                   APPLE_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$TEAM_ID"
          else
            export APPLE_SIGNING_IDENTITY="-"
          fi
          extra=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          cargo tauri build --target universal-apple-darwin "${extra[@]}"
      - name: Update manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          B=app/src-tauri/target/universal-apple-darwin/release/bundle/macos
          [ -f "$B/Lumen.app.tar.gz.sig" ] || { echo "no updater signature, skipping"; exit 0; }
          VER=${GITHUB_REF_NAME#v}
          mv "$B/Lumen.app.tar.gz" "$B/Lumen_universal.app.tar.gz"
          mv "$B/Lumen.app.tar.gz.sig" "$B/Lumen_universal.app.tar.gz.sig"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Lumen_universal.app.tar.gz"
          python3 - "$VER" "$URL" "$B/Lumen_universal.app.tar.gz.sig" > "$B/latest.json" <<'PY'
          import json, sys, datetime
          ver, url, sig = sys.argv[1], sys.argv[2], open(sys.argv[3]).read().strip()
          p = {"signature": sig, "url": url}
          print(json.dumps({"version": ver, "notes": f"Lumen {ver}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"darwin-aarch64": p, "darwin-x86_64": p, "darwin-universal": p}}, indent=2))
          PY
          cat "$B/latest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-macos-universal
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      # Tag a version (git tag v0.2.0 && git push --tags) to publish the DMG.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/Lumen_universal.app.tar.gz
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/Lumen_universal.app.tar.gz.sig
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/latest.json
          fail_on_unmatched_files: false
          generate_release_notes: true
